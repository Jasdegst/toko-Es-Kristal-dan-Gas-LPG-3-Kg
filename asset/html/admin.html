<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dashboard Admin</title>

<link rel="stylesheet" href="../css/admin.css">

</head>

<body>

<div class="container">
<button class="back-btn" onclick="history.back()">
    ← Kembali
</button>
<h1>Dashboard Admin</h1>

<div class="cards">

<div class="card">
<h2 id="totalOrder">0</h2>
<p>Total Pesanan</p>
</div>

<div class="card">
<h2 id="totalEs">0</h2>
<p>Es Kristal</p>
</div>

<div class="card">
<h2 id="totalGas">0</h2>
<p>Gas LPG</p>
</div>

</div>

<div class="table-box">

<h2>Pesanan Terbaru</h2>

<table>

<thead>

<tr>

<th>Tanggal</th>
<th>Nama</th>
<th>HP</th>
<th>Produk</th>
<th>Jumlah</th>
<th>Alamat</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

</div>

<script src="../js/admin.js"></script>

</body>

</html>
