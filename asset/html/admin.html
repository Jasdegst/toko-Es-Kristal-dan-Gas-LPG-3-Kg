<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../image/ChatGPT Image 13 Jun 2026, 04.36.56 - Copy1.png">

<title>Dashboard Admin</title>

<link rel="stylesheet" href="../css/admin.css">

</head>

<body>

<div class="container">

    <div class="top-menu">

        <a href="../../index.html" class="back-btn">
            🏠 Beranda
        </a>

        <button onclick="logout()" class="logout-btn">
            🚪 Logout
        </button>

    </div>

    <h1>Dashboard Admin</h1>

    <!-- KARTU DASHBOARD -->

    <div class="cards" id="dashboardCards">

    </div>

    <!-- TABEL PESANAN -->

    <div class="table-box">

        <h2>Pesanan Terbaru</h2>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Tanggal</th>
                    <th>Nama</th>
                    <th>HP</th>
                    <th>Produk</th>
                    <th>Jumlah</th>
                    <th>Alamat</th>
                    <th>Aksi</th>
                </tr>

            </thead>

            <tbody id="tableBody">

            </tbody>

        </table>

    </div>

    <!-- FORM PRODUK -->

    <div class="produk-box">

        <h2>Kelola Produk</h2>

        <form id="produkForm">

            <input
                type="text"
                id="namaProduk"
                placeholder="Nama Produk"
                required>

            <input
                type="number"
                id="hargaProduk"
                placeholder="Harga Produk"
                required>

            <input
                type="number"
                id="stokProduk"
                placeholder="Stok Produk"
                required>

            <input
                 type="text"
                 id="gambarProduk"
                 placeholder="URL Gambar Produk"
                required>    

            <button type="submit">
                Simpan Produk
            </button>

        </form>

    </div>

    <!-- TABEL PRODUK -->

    <div class="produk-box">

        <h2>Daftar Produk</h2>

        <table class="produk-table">

            <thead>

                <tr>
                    <th>Produk</th>
                    <th>Harga</th>
                    <th>Stok</th>
                    <th>Aksi</th>
                </tr>

            </thead>

            <tbody id="produkBody">

            </tbody>

        </table>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/admin.js"></script>

</body>
</html>
