<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kadai Es batu Asimo-Okay</title>

<link rel="stylesheet" href="asset/css/style.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        <img src="asset/image/ChatGPT Image 13 Jun 2026, 04.36.56 - Copy1.png" alt="Logo Es Batu & Okay, Asimo Sosis">
        <span>Kadai Es batu Asimo-Okay</span>
    </div>

    <ul class="menu">

        <li>
            <a href="#home">Beranda</a>
        </li>

        <li>
            <a href="#produk-list">Produk</a>
        </li>

        <li>
            <a href="#pesan">Pesan</a>
        </li>

        <li>
            <a href="asset/html/admin.html">Admin</a>
        </li>

    </ul>

</nav>

<header id="home">

    <div class="hero">

        <h1>
            Jual Es Batu & Sosis Asimo-Okay
        </h1>

        <p>
            Melayani Antar Terdekat Saja
        </p>

        <a href="#pesan" class="btn">
            Pesan Sekarang
        </a>

    </div>

</header>

<section class="produk" id="produk-list">

    <h2>Produk Kami</h2>

    <div
        class="produk-grid"
        id="produkGrid">

    </div>

</section>

<section class="form-order" id="pesan">

    <h2>Form Pemesanan</h2>

    <form id="orderForm">

        <input
        type="text"
        id="nama"
        placeholder="Nama Lengkap"
        required>

        <input
        type="tel"
        id="hp"
        placeholder="Nomor WhatsApp"
        required>

        <select id="produk" name="produk" required>
    <option value="">
        Memuat Produk...
    </option>
        </select>

        <input
        type="number"
        id="jumlah"
        placeholder="Jumlah Pesanan"
        required>

        <textarea
        id="alamat"
        rows="4"
        placeholder="Alamat Lengkap"
        required></textarea>

        <button type="submit">

            Pesan Sekarang

        </button>

    </form>

    <div id="status"></div>

</section>

<footer>

    <h3>
        Jual Es Batu & Sosis Asimo-Okay
    </h3>

    <p>
        © 2026 Semua Hak Dilindungi
    </p>

    <p class="creator">
        Created by
        <a
            href="https://jasdegst.github.io/JASDEGstDigitalMarketingDanSEOAgency/"
            target="_blank"
            rel="noopener noreferrer">
            Jasdegst
        </a>
    </p>

</footer>

<!-- FLOAT BUTTON -->
<button class="calc-fab" onclick="toggleCalc()">
    
</button>

<!-- POPUP KALKULATOR -->
<div class="calc-popup" id="calcPopup">

    <div class="calc-header">
        <span>Kalkulator</span>
        <button onclick="toggleCalc()">✖</button>
    </div>

    <input type="text" id="calcDisplay" readonly>

    <div class="calc-buttons">
        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button onclick="press('/')">÷</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('*')">×</button>

        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="press('-')">-</button>

        <button onclick="press('0')">0</button>
        <button onclick="backspace()">⌫</button>
        <button onclick="calculate()">=</button>
        <button onclick="press('+')">+</button>
        <button onclick="clearCalc()">C</button>
    </div>

</div>
<div class="calc-overlay" id="calcOverlay" onclick="toggleCalc()"></div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="asset/js/script.js"></script>
<script src="asset/js/kalkulator.js"></script>

</body>

</html>
