<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Toko Es Kristal & Gas LPG</title>

<link rel="stylesheet" href="asset/css/style.css">

</head>

<body>

<header>

<h1>TOKO ES KRISTAL & GAS LPG</h1>

<p>Melayani Antar Sampai Tujuan</p>

</header>

<section class="produk">

<div class="card">

<h2>Es Kristal</h2>

<p>Harga Rp10.000 / Karung</p>

</div>

<div class="card">

<h2>Gas LPG 3 Kg</h2>

<p>Harga Rp22.000 / Tabung</p>

</div>

</section>

<section class="form-order">

<h2>Form Pemesanan</h2>

<form id="orderForm">

<input
type="text"
id="nama"
placeholder="Nama Lengkap"
required>

<input
type="text"
id="hp"
placeholder="Nomor WhatsApp"
required>

<select id="produk">

<option>Es Kristal</option>

<option>Gas LPG 3 Kg</option>

</select>

<input
type="number"
id="jumlah"
placeholder="Jumlah Pesanan"
required>

<textarea
id="alamat"
placeholder="Alamat Lengkap"
required></textarea>

<button type="submit">
Pesan Sekarang
</button>

</form>

<div id="status"></div>

</section>

<script src="asset/js/script.js"></script>

</body>
</html>
